<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Wedding Filmmaker v17 SYNC</title>
<style>
:root{--bg:#0e0e0e;--panel:#191919;--panel2:#222;--line:#303030;--text:#f5f5f5;--muted:#999}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:540px;margin:auto;min-height:100vh;background:var(--bg)}
header{padding:20px 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;background:rgba(14,14,14,.96);backdrop-filter:blur(12px)}
h1{font-size:25px;margin:0}h2{font-size:22px;margin:8px 0 14px}h3{font-size:16px;margin:22px 0 10px}.muted{color:var(--muted);font-size:13px}
.content{padding:8px 15px 105px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0}.hero{background:linear-gradient(145deg,#292929,#181818)}
.date{font-size:13px;color:#aaa}.names{font-size:23px;font-weight:700;margin:6px 0}.row{display:flex;gap:9px}.stat{flex:1;background:#131313;border-radius:13px;padding:11px}.stat b{display:block;font-size:17px;margin-bottom:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;min-height:92px}.tile:active{transform:scale(.98)}.icon{font-size:24px}.tile b{display:block;margin-top:7px}.tile span{font-size:12px;color:var(--muted)}
button.primary{border:0;border-radius:12px;padding:11px 14px;background:#f2f2f2;color:#111;font-weight:700}button.secondary{border:1px solid #444;border-radius:12px;padding:10px 13px;background:#242424;color:#fff}button.danger{background:#291919;border-color:#633;color:#fff}
input,textarea,select{width:100%;border:1px solid #3a3a3a;background:#121212;color:#fff;border-radius:11px;padding:11px 12px;outline:0}textarea{min-height:75px;resize:vertical}
label{display:block;font-size:12px;color:#aaa;margin:11px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:13px}.actions>*{flex:1}
.badge{display:inline-block;padding:5px 8px;border-radius:9px;background:#292929;color:#ddd;font-size:11px;margin:2px}.ok{background:#18321f}.warn{background:#352d18}
.wedding-item{display:flex;justify-content:space-between;gap:10px;align-items:center}.wedding-item:active{opacity:.8}.wedding-info{min-width:0}.wedding-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wedding-actions{display:flex;gap:5px;flex-shrink:0}
.timeline{border-left:2px solid #444;margin:14px 0 4px 8px;padding-left:18px}.event{position:relative;margin:18px 0}.event:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#eee;left:-24px;top:4px}.eventrow{display:flex;justify-content:space-between;gap:8px}.time{font-weight:700}.eventactions{display:flex;gap:4px}.eventactions button{padding:5px 8px}
.check{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid #272727}.check input{width:auto;margin-top:3px}.check label{margin:0;color:#eee;font-size:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-title b{font-size:16px}.smallbtn{padding:6px 9px!important;font-size:12px!important}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#181818;border-top:1px solid #303030;display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:none;color:#999;font-size:11px;min-width:65px}.bottom b{display:block;color:#fff;font-size:20px;margin-bottom:2px}

.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.calendar-nav{display:flex;gap:6px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-dow{font-size:12px;text-align:center;color:#888;padding:4px 0}.cal-day{min-height:68px;border:1px solid #303030;border-radius:12px;background:#171717;padding:7px;cursor:pointer}.cal-day.empty{opacity:0;border:0;background:transparent;cursor:default}.cal-day .num{font-weight:700}.cal-day.booked{border-color:#7a3030;background:#211616}.cal-day.hold{border-color:#796126;background:#211d14}.cal-day.contract{border-color:#315c7a;background:#151d24}.cal-day.today{box-shadow:inset 0 0 0 1px #fff}.cal-day .dot{font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendar-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.calendar-legend span{font-size:12px}.booking-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #292929}.booking-row:last-child{border-bottom:0}.booking-date{width:58px;font-weight:700}.booking-main{flex:1;min-width:0}.booking-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.booking-actions{display:flex;gap:5px}..modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(540px,100%);margin:auto;background:#181818;border:1px solid #333;border-radius:22px 22px 0 0;padding:17px;max-height:92vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0}.sheethead button{border:0;background:none;color:#fff;font-size:27px}
.notice{font-size:12px;color:#aaa;background:#131313;border:1px solid #2c2c2c;border-radius:11px;padding:10px;margin-top:10px}.empty{text-align:center;padding:30px 10px;color:#888}
</style>

<style>
.idea-link{cursor:pointer;transition:transform .12s ease, border-color .12s ease}
.idea-link:active{transform:scale(.985)}
.idea-action{display:block;margin-top:10px;font-weight:700}
</style>
<style>
.tile{cursor:pointer}.tile:active{transform:scale(.985)}
</style>
</head>
<body>
<div class="app">
<header><div><div class="muted">WEDDING FILMMAKER</div><h1 id="headerTitle">Мои свадьбы</h1></div><button class="primary" onclick="newWedding()">＋</button></header>
<main class="content" id="app"></main>
<nav class="bottom">
<button onclick="showWeddings()"><b>📅</b>Свадьбы</button>
<button onclick="showCurrent()"><b>🎥</b>Текущая</button>
<button onclick="showTasks()"><b>☑</b>Чеклисты</button>
<button onclick="showSettings()"><b>⚙</b>Настройки</button>
</nav>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Редактирование</h2><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='wedding-filmmaker-v4';
const LEGACY_KEYS=["wedding-filmmaker-v3", "wedding-filmmaker-v2", "wedding-filmmaker-v1"];
function loadDatabase(){
  let raw=localStorage.getItem(KEY), source=KEY;
  if(!raw){ for(const k of LEGACY_KEYS){ const candidate=localStorage.getItem(k); if(candidate){raw=candidate;source=k;break;} } }
  if(raw){ try{ const parsed=JSON.parse(raw); if(parsed && Array.isArray(parsed.weddings)) return {db:parsed,migrated:source!==KEY,source}; }catch(e){} }
  return {db:null,migrated:false,source:null};
}
const LOADED=loadDatabase();
const checklistTemplate={
 shooting:['Кадры деталей (кольца, платье, букет)','Сборы невесты','Сборы жениха','Портреты пары','Родители и близкие','Выход из дома / встреча','ЗАГС: вход','ЗАГС: церемония','ЗАГС: выход','Прогулка пары','Детали площадки','Гости и атмосфера','Первый танец','Тосты и реакции гостей','Торт','Финал вечера'],
 interviews:['Интервью жениха','Интервью невесты','Интервью родителей','Интервью друзей','Общее интервью пары'],
 montage:['Отобрать лучший материал','Собрать структуру фильма','Синхронизировать звук','Сделать черновой монтаж','Цветокоррекция','Сведение звука','Финальный просмотр','Экспорт фильма','Экспорт клипа / тизера','Резервная копия проекта']
};
let db=LOADED.db;
if(!db){
 db={selected:1,nextId:2,weddings:[makeWedding(1,'2026-09-26','Ставрополь','Алексей & Мария')],settings:{camera:'Canon EOS R6 Mark II',lenses:'RF 24-70mm F2.8 L IS USM; RF 70-200mm F2.8 L IS USM',gimbal:'DJI RS5 Combo',audio:'Hollyland / DJI Mic'}};
 save();
}
function makeWedding(id,date='2026-09-26',city='',names=''){
 const checks={};Object.keys(checklistTemplate).forEach(k=>checks[k]=checklistTemplate[k].map(x=>({text:x,done:false})));
 return {id,date,city,names,bookingStatus:'confirmed',price:'60000',deposit:'0',depositDate:'',contract:false,start:'12:00',end:'23:00',
  guests:'',hall:'',walkPlace:'',bridePrep:'',registry:'',
  paymentStatus:'partial',balanceDate:'',payments:[],
  route:{prepStart:'',prepEnd:'',registryStart:'',registryEnd:'',walkStart:'',walkEnd:'',banquetStart:'',banquetEnd:'',outdoorStart:'',outdoorEnd:''},ceremonyType:'zags',outdoorCeremony:false,outdoorPlace:'',
  contacts:{customer:'',phone:'',telegram:'',groom:'',bride:'',groomPhone:'',bridePhone:'',notes:''},
  clientProfile:{source:'',anniversary:'',preferences:'',importantPeople:'',mustFilm:'',avoidFilm:'',music:'',notes:''},
  team:{host:'',photographer:'',decorator:'',organizer:'',specialEffects:'',makeup:'',other:''},
  equipment:{camera:'',lenses:'',gimbal:'',audio:'',drone:false,light:false,secondOperator:false,notes:''},
  shotPlan:{details:false,prep:false,zags:false,walk:false,guests:false,banquet:false,dance:false,toasts:false,cake:false,finale:false},
  sound:{groom:false,bride:false,host:false,recorder:false,mixer:false,backup:false,levels:false},
  post:{cards:false,backup1:false,backup2:false,sorted:false,proxies:false,rough:false,color:false,sound:false,export:false,delivered:false},
  deliverables:{film:true,clip:true,teaser:false,social:false,raw:false,filmMinutes:'',clipMinutes:''},
  reminders:[],
  events:[{id:1,time:'12:00',title:'Сборы невесты',place:'',note:'Детали · портреты'},
   {id:2,time:'14:00',title:'ЗАГС',place:'',note:'Вход · церемония · выход'},
   {id:3,time:'15:00',title:'Прогулка',place:'',note:'Пара · детали · гости'},
   {id:4,time:'17:00',title:'Ресторан',place:'',note:'Первый танец · тосты · эмоции'}],checks};
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function normalizeWedding(w){
 w.bookingStatus ??= (w.contract ? 'contract' : 'confirmed');
 if(!['confirmed','hold','contract'].includes(w.bookingStatus)) w.bookingStatus='confirmed';
 w.guests ??= ''; w.hall ??= ''; w.walkPlace ??= ''; w.bridePrep ??= ''; w.registry ??= '';
 w.paymentStatus ??= Number(w.deposit||0)>=Number(w.price||0)?'paid':Number(w.deposit||0)>0?'partial':'unpaid';
 w.balanceDate ??= ''; w.payments ??= [];
 w.route ??= {prepStart:'',prepEnd:'',registryStart:'',registryEnd:'',walkStart:'',walkEnd:'',banquetStart:'',banquetEnd:'',outdoorStart:'',outdoorEnd:''};
 w.route.prepStart ??= w.route.prepTime||''; w.route.prepEnd ??= '';
 w.route.registryStart ??= w.route.registryTime||''; w.route.registryEnd ??= '';
 w.route.walkStart ??= w.route.walkTime||''; w.route.walkEnd ??= '';
 w.route.banquetStart ??= w.route.banquetTime||''; w.route.banquetEnd ??= '';
 w.route.outdoorStart ??= ''; w.route.outdoorEnd ??= '';
 w.outdoorCeremony ??= false; w.outdoorPlace ??= '';
 w.ceremonyType ??= (w.outdoorCeremony ? 'outdoor' : (w.registry || w.route.registryStart || w.route.registryEnd ? 'zags' : 'none'));
 if(!['none','zags','outdoor'].includes(w.ceremonyType)) w.ceremonyType=w.outdoorCeremony?'outdoor':'zags';
 w.outdoorCeremony = w.ceremonyType==='outdoor';
 w.shotPlan ??= {details:false,prep:false,zags:false,walk:false,guests:false,banquet:false,dance:false,toasts:false,cake:false,finale:false};
 w.sound ??= {groom:false,bride:false,host:false,recorder:false,mixer:false,backup:false,levels:false};
 w.post ??= {cards:false,backup1:false,backup2:false,sorted:false,proxies:false,rough:false,color:false,sound:false,export:false,delivered:false};
 w.deliverables ??= {film:true,clip:true,teaser:false,social:false,raw:false,filmMinutes:'',clipMinutes:''};
 w.reminders ??= [];
 w.contacts ??= {customer:'',phone:'',telegram:'',groom:'',bride:'',groomPhone:'',bridePhone:'',notes:''};
 w.contacts.groom ??= ''; w.contacts.bride ??= ''; w.contacts.groomPhone ??= ''; w.contacts.bridePhone ??= ''; w.contacts.notes ??= '';
 w.clientProfile ??= {source:'',anniversary:'',preferences:'',importantPeople:'',mustFilm:'',avoidFilm:'',music:'',notes:''};
 w.team ??= {host:'',photographer:'',decorator:'',organizer:'',specialEffects:'',makeup:'',other:''};
 w.equipment ??= {camera:'',lenses:'',gimbal:'',audio:'',drone:false,light:false,secondOperator:false,notes:''};
 w.events ??= []; w.checks ??= {};
 Object.keys(checklistTemplate).forEach(k=>w.checks[k] ??= checklistTemplate[k].map(x=>({text:x,done:false})));
 return w;
}
db.weddings.forEach(normalizeWedding);

function ensureOperational(w){
 w.weather ??= {condition:'',temp:'',note:''};
 w.journal ??= '';
 w.travel ??= {defaultMinutes:'',notes:''};
 w.wishes ??= {must:'',avoid:'',importantPeople:'',special:'',notes:''};
 w.guestGroups ??= '';
 w.events ??= [];
 syncRouteToEvents(w);
 return w;
}
function opCurrent(){return ensureOperational(current())}
function timeMinutes(t){if(!t)return null;const a=t.split(':').map(Number);return a[0]*60+a[1]}
function gapMinutes(a,b){const x=timeMinutes(a),y=timeMinutes(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d}
function nextEvent(w){const now=new Date();const today=w.date===now.toISOString().slice(0,10);const cur=now.getHours()*60+now.getMinutes();const list=[...w.events].sort((a,b)=>(a.time||'').localeCompare(b.time||''));return today?list.find(e=>timeMinutes(e.time)>=cur):list[0]}
function routeEvents(w){
 const r=w.route||{}, defs=[
 ['route-prep',r.prepStart,r.prepEnd,'Сборы невесты',w.bridePrep||'','Детали · портреты'],
 ...(w.ceremonyType==='zags' ? [['route-registry',r.registryStart,r.registryEnd,'ЗАГС',w.registry||'','Вход · церемония · выход']] : []),
 ['route-walk',r.walkStart,r.walkEnd,'Прогулка',w.walkPlace||'','Пара · детали · гости'],
 ...(w.ceremonyType==='outdoor' ? [['route-outdoor',r.outdoorStart,r.outdoorEnd,'Выездная регистрация',w.outdoorPlace||'','Церемония']] : []),
 ['route-banquet',r.banquetStart,r.banquetEnd,'Банкет',w.hall||'','Первый танец · тосты · эмоции']
 ];
 return defs.filter(x=>x[1]).map(x=>({id:x[0],time:x[1],title:x[3],place:x[4],note:x[5],endTime:x[2],source:'route'}));
}
function syncRouteToEvents(w){
 const custom=(w.events||[]).filter(e=>e.source!=='route'&&!String(e.id).startsWith('route-'));
 w.events=[...routeEvents(w),...custom].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function syncEventsToRoute(w){
 const r=w.route||{}, by=Object.fromEntries((w.events||[]).map(e=>[String(e.id),e]));
 const map={'route-prep':['prepStart','prepEnd'],'route-registry':['registryStart','registryEnd'],'route-walk':['walkStart','walkEnd'],'route-outdoor':['outdoorStart','outdoorEnd'],'route-banquet':['banquetStart','banquetEnd']};
 Object.entries(map).forEach(([id,k])=>{if(by[id]){r[k[0]]=by[id].time||'';r[k[1]]=by[id].endTime||'';}});
 w.route=r;
}
function migrateDatabase(){
 db.weddings=(db.weddings||[]).map(w=>{
  normalizeWedding(w);ensureOperational(w);
  const legacyMap=[[/сбор/i,'route-prep','prepStart','prepEnd'],[/загс/i,'route-registry','registryStart','registryEnd'],[/прогул/i,'route-walk','walkStart','walkEnd'],[/выезд/i,'route-outdoor','outdoorStart','outdoorEnd'],[/ресторан|банкет/i,'route-banquet','banquetStart','banquetEnd']];
  for(const e of (w.events||[])){
   if(e.source==='route')continue;
   const hit=legacyMap.find(x=>x[0].test(e.title||''));
   if(hit && !w.route[hit[2]] && e.time){w.route[hit[2]]=e.time;w.route[hit[3]]=e.endTime||'';}
  }
  syncRouteToEvents(w);return w;
 });
 save();
}
migrateDatabase();
if(LOADED.migrated){setTimeout(()=>alert('База предыдущей версии автоматически перенесена.'),300);}

function calendarStatus(w){
 const st=w.bookingStatus||'confirmed';
 if(w.archived)return 'archive';
 return st;
}
function bookingStatusLabel(st){return st==='hold'?'Предварительная бронь':st==='contract'?'Договор подписан':st==='archive'?'Архив':'Забронировано'}
function bookingStatusClass(st){return st==='hold'?'hold':st==='contract'?'contract':'booked'}
function monthTitle(y,m){return new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(y,m,1)).replace(/^./,c=>c.toUpperCase())}
function showCalendar(monthOffset=window.calendarMonthOffset||0){
 window.calendarMonthOffset=monthOffset;
 headerTitle.textContent='Забронированные даты';
 const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+monthOffset);
 const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
 const mondayIndex=(first.getDay()+6)%7;
 const booked=new Map();(db.weddings||[]).forEach(w=>{if(w.date&&!w.archived)booked.set(w.date,w)});
 const today=new Date();const todayKey=today.toISOString().slice(0,10);
 let cells='';
 for(let i=0;i<mondayIndex;i++)cells+='<div class="cal-day empty"></div>';
 for(let d=1;d<=days;d++){
   const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,w=booked.get(key),st=w?calendarStatus(w):'';
   cells+=`<div class="cal-day ${w?bookingStatusClass(st):''} ${key===todayKey?'today':''}" onclick="${w?`openWedding(${w.id})`:''}"><div class="num">${d}</div>${w?`<div class="dot">${st==='hold'?'🟡':st==='contract'?'🔵':'🔴'} ${esc(w.names||'Забронировано')}</div><div class="muted" style="font-size:10px">${esc(w.city||'')}</div>`:''}</div>`;
 }
 const list=[...(db.weddings||[])].filter(w=>!w.archived&&w.date&&w.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).sort((a,b)=>a.date.localeCompare(b.date));
 app.innerHTML=`<h2>📅 Забронированные даты</h2>
 <div class="card"><div class="calendar-head"><button class="secondary smallbtn" onclick="showCalendar(${monthOffset-1})">‹</button><b>${monthTitle(y,m)}</b><button class="secondary smallbtn" onclick="showCalendar(${monthOffset+1})">›</button></div>
 <div class="calendar-grid" style="margin-top:10px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
 <div class="calendar-legend"><span>🔴 Забронировано</span><span>🟡 Предварительная бронь</span><span>🔵 Договор подписан</span></div></div>
 <h3>${list.length?'Свадьбы в этом месяце':'Свободных/забронированных свадеб в этом месяце нет'}</h3>
 ${list.map(w=>`<div class="card booking-row" onclick="openWedding(${w.id})"><div class="booking-date">${formatDate(w.date).slice(0,5)}</div><div class="booking-main"><b>${esc(w.names||'Без названия')}</b><span class="muted">${esc(w.city||'')} · ${bookingStatusLabel(calendarStatus(w))} · ${money(w.price)}</span></div><div class="booking-actions"><button class="secondary smallbtn" onclick="event.stopPropagation();editWedding(${w.id})">✎</button></div></div>`).join('')}
 <div class="card"><div class="section-title"><b>Сводка</b><span class="badge">${list.length} дат</span></div><div class="muted" style="margin-top:8px">🔴 ${list.filter(w=>(w.bookingStatus||'confirmed')==='confirmed').length} забронировано · 🟡 ${list.filter(w=>w.bookingStatus==='hold').length} предбронь · 🔵 ${list.filter(w=>w.bookingStatus==='contract').length} договор</div></div>
 <button class="secondary" style="width:100%" onclick="showWeddings()">← Все свадьбы</button>`;
}
function showLogistics(){
 const w=opCurrent(), ev=[...w.events].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const gaps=ev.slice(0,-1).map((e,i)=>{const n=ev[i+1],g=gapMinutes(e.time,n.time);return {a:e,b:n,g}}).filter(x=>x.g!=null);
 const risky=gaps.filter(x=>x.g<30);

function current(){return ensureOperational(normalizeWedding(db.weddings.find(w=>w.id===db.selected)||db.weddings[0]))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v||0))+' ₽'}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
function formatDate(s){if(!s)return 'Дата не указана';let a=s.split('-');return `${a[2]}.${a[1]}.${a[0]}`}
function openWedding(id){db.selected=id;save();showCurrent();}
function selectWedding(id){db.selected=id;save();showCurrent()}
function weddingStatus(w){
 const today=new Date(); today.setHours(0,0,0,0);
 const d=new Date((w.date||'').replace(/-/g,'/')); d.setHours(0,0,0,0);
 if(w.archived)return 'archive';
 if(!isNaN(d.getTime()) && d<today)return 'past';
 return 'planned';
}
function statusLabel(st){return st==='planned'?'Запланированные':st==='past'?'Прошедшие':'Архив'}
function weddingCard(w){
 const st=weddingStatus(w);
 return `<div class="card wedding-item" onclick="openWedding(${w.id})">
  <div class="wedding-info"><div class="muted">${formatDate(w.date)} · ${esc(w.city)}</div><b>${esc(w.names)||'Без названия'}</b>
  <span class="badge">${money(w.price)}</span><span class="badge">👥 ${esc(w.guests||'—')}</span>
  <span class="badge ${w.contract?'ok':''}">${w.contract?'Договор ✓':'Договор не отмечен'}</span>
  <span class="badge ${Number(w.deposit)>0?'ok':''}">Предоплата: ${money(w.deposit)}</span></div>
  <div class="wedding-actions"><button class="secondary smallbtn" onclick="event.stopPropagation();editWedding(${w.id})">✎</button><button class="secondary danger smallbtn" onclick="event.stopPropagation();deleteWedding(${w.id})">×</button></div>
 </div>`;
}

function reminderDateTime(r){return r.date+'T'+(r.time||'09:00')}
function reminderIsPast(r){return new Date(reminderDateTime(r)).getTime()<Date.now()}
function reminderLabel(r){
 const icons={payment:'💰',prep:'🎥',sound:'🎙',timeline:'📋',backup:'💾',montage:'🎬',delivery:'📦',custom:'🔔'};
 return (icons[r.type]||'🔔')+' '+r.title;
}

 app.innerHTML=`<h2>Напоминания</h2>
 <div class="card hero">
  <div class="section-title"><b>Активные задачи</b><span class="badge">${items.filter(x=>!x.done).length}</span></div>
  <div class="muted" style="margin-top:5px">Напоминания привязаны к свадьбе «${esc(w.names||'Без названия')}».</div>
 </div>
 ${items.length?items.map((r,i)=>`<div class="card" style="${r.done?'opacity:.55':''}">
  <div class="check" style="border:0;padding:0">
   <input type="checkbox" ${r.done?'checked':''} onchange="toggleReminder(${i},this.checked)">

function addReminder(){
 const w=current();
 openModal('Новое напоминание',`<label>Название</label><input id="rTitle" placeholder="Например: получить остаток"><label>Дата</label><input id="rDate" type="date" value="${esc(w.date)}"><label>Время</label><input id="rTime" type="time" value="09:00"><label>Тип</label><select id="rType"><option value="custom">Другое</option><option value="payment">Оплата</option><option value="prep">Техника</option><option value="sound">Звук</option><option value="timeline">Тайминг</option><option value="backup">Бэкап</option><option value="montage">Монтаж</option><option value="delivery">Выдача</option></select><label>Заметка</label><textarea id="rNote"></textarea><div class="actions"><button class="primary" onclick="saveReminder()">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`);
}
function saveReminder(){
 const w=current(); const title=rTitle.value.trim()||'Напоминание';
 w.reminders.push({id:Date.now(),title,date:rDate.value,time:rTime.value,type:rType.value,note:rNote.value.trim(),done:false});
 save();closeModal();showReminders();
}
function quickReminder(type){
 const w=current(); const base=new Date(w.date+'T09:00'); let d=new Date(base);
 let title='';let note='';
 if(type==='prep'){d.setDate(d.getDate()-1);title='Проверить технику';note='Батареи, карты памяти, камеры, объективы, стабилизатор.'}
 if(type==='sound'){d.setDate(d.getDate()-1);title='Проверить звук';note='Микрофоны, рекордер, пульт, резервная запись.'}
 if(type==='timeline'){d.setDate(d.getDate()-1);title='Проверить тайминг';note='Сверить время сборов, ЗАГС, прогулки и банкета.'}
 if(type==='backup'){d.setDate(d.getDate()+1);title='Сделать резервную копию';note='Скопировать материал минимум в две независимые копии.'}
 const iso=d.toISOString().slice(0,10);
 w.reminders.push({id:Date.now(),title,date:iso,time:'09:00',type,note,done:false});
 save();showReminders();
}
function toggleReminder(i,v){current().reminders[i].done=v;save();showReminders()}
function deleteReminder(i){current().reminders.splice(i,1);save();showReminders()}

function currentReminderPreview(w){
 const arr=[...(w.reminders||[])].filter(x=>!x.done).sort((a,b)=>reminderDateTime(a).localeCompare(reminderDateTime(b))).slice(0,4);

  </div>

  <button class="secondary" style="width:100%;margin-top:8px" onclick="archiveWedding(${w.id})">${w.archived?'↩ Вернуть из архива':'🗄 В архив'}</button>
 </div>
 <div class="grid">
  <div class="tile" onclick="showTimeline()"><div class="icon">⏱</div><b>Тайминг</b><span>${w.events.length} событий</span></div>
  <div class="tile" onclick="showTeam()"><div class="icon">👥</div><b>Команда</b><span>Все участники</span></div>
  <div class="tile" onclick="showEquipmentChecklist()"><div class="icon">${role==='Фотограф'?'📷':'🎥'}</div><b>Техника</b><span>Проверка комплекта</span></div>
  <div class="tile" onclick="showTasks()"><div class="icon">☑</div><b>Чеклисты</b><span>Подготовка и работа</span></div>
  <div class="tile" onclick="showPost()"><div class="icon">🖥️</div><b>Постпродакшн</b><span>Этапы готовности</span></div>
  <div class="tile" onclick="showReminders()"><div class="icon">🔔</div><b>Напоминания</b><span>${activeRem} активных</span></div>
 </div>
 <div class="card"><div class="section-title"><b>Ближайшее событие</b><span class="muted">${esc(next?.time||'—')}</span></div><div style="font-size:18px;margin-top:10px">${role==='Фотограф'?'📷':'🎬'} ${esc(next?.title||'Нет событий')}</div><div class="muted">${esc(next?.place||'Локация не указана')}</div></div>
 <h3>Тайминг</h3><div class="card">${timelineHTML(4)}</div>
 <h3>🔔 Ближайшие задачи</h3><div class="card">${currentReminderPreview(w)}</div>`;
}

function timelineHTML(limit=999){
 const w=current();if(!w.events.length)return '<div class="empty">Событий нет</div>';
 return '<div class="timeline">'+w.events.slice(0,limit).map(e=>`<div class="event"><div class="eventrow"><div><div class="time">${esc(e.time)} — ${esc(e.title)}</div><div class="muted">${esc(e.place||'')} ${e.place&&e.note?'· ':''}${esc(e.note||'')}</div></div><div class="eventactions"><button class="secondary" onclick="editEvent(${e.id})">✎</button><button class="secondary danger" onclick="deleteEvent(${e.id})">×</button></div></div></div>`).join('')+'</div>';
}
function showTimelineLegacy(){const w=current();app.innerHTML=`<h2>Тайминг</h2><div class="card"><div class="formgrid"><div><label>Начало</label><input type="time" value="${esc(w.start)}" onchange="weddingField('start',this.value)"></div><div><label>Окончание</label><input type="time" value="${esc(w.end)}" onchange="weddingField('end',this.value)"></div></div></div><div class="card">${timelineHTML()}</div><button class="primary" style="width:100%" onclick="editEvent()">＋ Добавить событие</button>`}
function weddingField(k,v){current()[k]=v;save()}
function editEvent(id){
 const w=current(),e=id?w.events.find(x=>x.id===id):{time:'',title:'',place:'',note:''};
 openModal(id?'Изменить событие':'Новое событие',`<label>Время</label><input id="eTime" type="time" value="${esc(e.time)}"><label>Название</label><input id="eTitle" value="${esc(e.title)}"><label>Локация</label><input id="ePlace" value="${esc(e.place)}"><label>Заметка</label><textarea id="eNote">${esc(e.note)}</textarea><div class="actions"><button class="primary" onclick="saveEvent(${id||0})">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`);
}
function saveEvent(id){const w=current(),old=id?w.events.find(x=>x.id===id):null,obj={id:id||Date.now(),time:eTime.value,title:eTitle.value.trim()||'Событие',place:ePlace.value.trim(),note:eNote.value.trim(),endTime:old?.endTime||''};
 const routeMap={'route-prep':['prepStart','prepEnd'],'route-registry':['registryStart','registryEnd'],'route-walk':['walkStart','walkEnd'],'route-outdoor':['outdoorStart','outdoorEnd'],'route-banquet':['banquetStart','banquetEnd']};
 if(id&&routeMap[id]){w.route[routeMap[id][0]]=obj.time;syncRouteToEvents(w)}else if(id)w.events=w.events.map(x=>x.id===id?obj:x);else w.events.push(obj);w.events.sort((a,b)=>(a.time||'').localeCompare(b.time||''));save();closeModal();showTimeline()}
function deleteEvent(id){if(!confirm('Удалить событие?'))return;const w=current(),map={'route-prep':['prepStart','prepEnd'],'route-registry':['registryStart','registryEnd'],'route-walk':['walkStart','walkEnd'],'route-outdoor':['outdoorStart','outdoorEnd'],'route-banquet':['banquetStart','banquetEnd']};if(map[id]){w.route[map[id][0]]='';w.route[map[id][1]]='';syncRouteToEvents(w)}else{w.events=w.events.filter(x=>x.id!==id)}save();showTimeline()}
function editWedding(id){
 const w=db.weddings.find(x=>x.id===id)||makeWedding(db.nextId);
 openModal('Данные свадьбы',`<label>Дата свадьбы</label><input id="wDate" type="date" value="${esc(w.date)}"><label>Статус даты</label><select id="wBookingStatus"><option value="confirmed" ${w.bookingStatus==='confirmed'?'selected':''}>🔴 Забронировано</option><option value="hold" ${w.bookingStatus==='hold'?'selected':''}>🟡 Предварительная бронь</option><option value="contract" ${w.bookingStatus==='contract'?'selected':''}>🔵 Договор подписан</option></select><label>Город</label><input id="wCity" value="${esc(w.city)}"><label>Молодожёны</label><input id="wNames" value="${esc(w.names)}"><div class="formgrid"><div><label>Начало</label><input id="wStart" type="time" value="${esc(w.start)}"></div><div><label>Окончание</label><input id="wEnd" type="time" value="${esc(w.end)}"></div></div><div class="formgrid"><div><label>Стоимость, ₽</label><input id="wPrice" type="number" value="${esc(w.price)}"></div><div><label>Предоплата внесена, ₽</label><input id="wDeposit" type="number" value="${esc(w.deposit)}"></div></div>
 <div class="formgrid"><div><label>Количество гостей</label><input id="wGuests" type="number" min="0" value="${esc(w.guests)}" placeholder="Например, 70"></div><div><label>Банкетный зал</label><input id="wHall" value="${esc(w.hall)}" placeholder="Название / адрес"></div></div>
 <label>Место прогулки</label><input id="wWalkPlace" value="${esc(w.walkPlace)}" placeholder="Парк, набережная, площадка...">
 <label>Место сборов</label><input id="wBridePrep" value="${esc(w.bridePrep)}" placeholder="Адрес / отель / дом">
 <label>Регистрация</label><select id="wCeremonyType"><option value="none" ${w.ceremonyType==='none'?'selected':''}>Без регистрации</option><option value="zags" ${w.ceremonyType==='zags'?'selected':''}>ЗАГС</option><option value="outdoor" ${w.ceremonyType==='outdoor'?'selected':''}>Выездная регистрация</option></select>
 <label>ЗАГС</label><input id="wRegistry" value="${esc(w.registry)}" placeholder="Название / адрес">
 <label>Место выездной регистрации</label><input id="wOutdoorPlace" value="${esc(w.outdoorPlace)}" placeholder="Площадка / адрес">
 <h3>Время по локациям</h3>
 <div class="formgrid"><div><label>Сборы — начало</label><input id="rPrepStart" type="time" value="${esc(w.route.prepStart)}"></div><div><label>Сборы — конец</label><input id="rPrepEnd" type="time" value="${esc(w.route.prepEnd)}"></div></div>
 <div class="formgrid"><div><label>ЗАГС — начало</label><input id="rRegistryStart" type="time" value="${esc(w.route.registryStart)}"></div><div><label>ЗАГС — конец</label><input id="rRegistryEnd" type="time" value="${esc(w.route.registryEnd)}"></div></div>
 <div class="formgrid"><div><label>Прогулка — начало</label><input id="rWalkStart" type="time" value="${esc(w.route.walkStart)}"></div><div><label>Прогулка — конец</label><input id="rWalkEnd" type="time" value="${esc(w.route.walkEnd)}"></div></div>
 <div class="formgrid"><div><label>Банкет — начало</label><input id="rBanquetStart" type="time" value="${esc(w.route.banquetStart)}"></div><div><label>Банкет — конец</label><input id="rBanquetEnd" type="time" value="${esc(w.route.banquetEnd)}"></div></div>
 <div class="formgrid"><div><label>Выездная — начало</label><input id="rOutdoorStart" type="time" value="${esc(w.route.outdoorStart)}"></div><div><label>Выездная — конец</label><input id="rOutdoorEnd" type="time" value="${esc(w.route.outdoorEnd)}"></div></div>
 <label>Дата предоплаты</label><input id="wDepositDate" type="date" value="${esc(w.depositDate)}"><div class="check"><input id="wContract" type="checkbox" ${w.contract?'checked':''}><label for="wContract">Договор подписан</label></div><label>Заказчик</label><input id="wCustomer" value="${esc(w.contacts.customer)}"><label>Телефон</label><input id="wPhone" value="${esc(w.contacts.phone)}"><label>Telegram</label><input id="wTelegram" value="${esc(w.contacts.telegram)}"><div class="actions"><button class="primary" onclick="saveWeddingForm(${id||0})">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`);
}
function newWedding(){editWedding(0)}
function saveWeddingForm(id){
 let w=db.weddings.find(x=>x.id===id);
 if(!w){w=makeWedding(db.nextId++,wDate.value,wCity.value.trim(),wNames.value.trim());db.weddings.push(w)}
 const duplicate=db.weddings.find(x=>x.id!==w.id && x.date===wDate.value && !x.archived); if(duplicate && !confirm('На эту дату уже есть свадьба: '+(duplicate.names||'без названия')+'. Всё равно сохранить?')) return; Object.assign(w,{date:wDate.value,bookingStatus:wBookingStatus.value,city:wCity.value.trim(),names:wNames.value.trim(),start:wStart.value,end:wEnd.value,price:wPrice.value,deposit:wDeposit.value,depositDate:wDepositDate.value,contract:wContract.checked,guests:wGuests.value,hall:wHall.value.trim(),walkPlace:wWalkPlace.value.trim(),bridePrep:wBridePrep.value.trim(),registry:wRegistry.value.trim()});
 w.ceremonyType=wCeremonyType.value;w.outdoorCeremony=w.ceremonyType==='outdoor';
 w.route={...w.route,prepStart:rPrepStart.value,prepEnd:rPrepEnd.value,registryStart:w.ceremonyType==='zags'?rRegistryStart.value:'',registryEnd:w.ceremonyType==='zags'?rRegistryEnd.value:'',walkStart:rWalkStart.value,walkEnd:rWalkEnd.value,banquetStart:rBanquetStart.value,banquetEnd:rBanquetEnd.value,outdoorStart:w.ceremonyType==='outdoor'?rOutdoorStart.value:'',outdoorEnd:w.ceremonyType==='outdoor'?rOutdoorEnd.value:''};w.outdoorPlace=w.ceremonyType==='outdoor'?wOutdoorPlace.value.trim():'';syncRouteToEvents(w);
 w.contacts={customer:wCustomer.value.trim(),phone:wPhone.value.trim(),telegram:wTelegram.value.trim()};
 db.selected=w.id;save();closeModal();showCurrent();
}
function deleteWedding(id){if(db.weddings.length===1)return alert('Нельзя удалить единственную свадьбу.');if(confirm('Удалить эту свадьбу?')){db.weddings=db.weddings.filter(w=>w.id!==id);if(db.selected===id)db.selected=db.weddings[0].id;save();showWeddings()}}
function showTeamLegacy(){
 const t=current().team;
 app.innerHTML=`<h2>Команда свадьбы</h2><div class="card">
 ${teamInput('host','🎤 Ведущий',t.host)}${teamInput('photographer','📷 Фотограф',t.photographer)}${teamInput('decorator','🌿 Оформители',t.decorator)}${teamInput('organizer','📋 Организатор',t.organizer)}${teamInput('specialEffects','✨ Спецэффекты',t.specialEffects)}${teamInput('makeup','💄 Визажисты',t.makeup)}${teamInput('other','👤 Другое',t.other)}
 </div><div class="notice">Все данные относятся к выбранной свадьбе.</div>`;
}
function teamInput(k,label,v){return `<label>${label}</label><input value="${esc(v)}" onchange="current().team['${k}']=this.value;save()">`}
function showEquipment(){
 const q=current().equipment;
 app.innerHTML=`<h2>Техника</h2><div class="card"><label>Камера</label><input value="${esc(q.camera)}" onchange="current().equipment.camera=this.value;save()"><label>Объективы</label><textarea onchange="current().equipment.lenses=this.value;save()">${esc(q.lenses)}</textarea><label>Стабилизатор</label><input value="${esc(q.gimbal)}" onchange="current().equipment.gimbal=this.value;save()"><label>Звук</label><input value="${esc(q.audio)}" onchange="current().equipment.audio=this.value;save()"><div class="check"><input type="checkbox" ${q.drone?'checked':''} onchange="current().equipment.drone=this.checked;save()"><label>Дрон</label></div><div class="check"><input type="checkbox" ${q.light?'checked':''} onchange="current().equipment.light=this.checked;save()"><label>Дополнительный свет</label></div><div class="check"><input type="checkbox" ${q.secondOperator?'checked':''} onchange="current().equipment.secondOperator=this.checked;save()"><label>Второй оператор</label></div><label>Заметки</label><textarea onchange="current().equipment.notes=this.value;save()">${esc(q.notes)}</textarea></div>`;
}
function showTasks(){
 const w=current();const tabs=[['shooting','🎥 Съёмка'],['interviews','🎤 Интервью'],['montage','🎬 Монтаж']];
 app.innerHTML=`<h2>Чеклисты</h2><div class="card">${tabs.map(([k,l])=>`<div style="margin-bottom:18px"><div class="section-title"><b>${l}</b><button class="secondary smallbtn" onclick="resetChecklist('${k}')">Сбросить</button></div>${w.checks[k].map((x,i)=>`<div class="check"><input type="checkbox" ${x.done?'checked':''} onchange="toggleCheck('${k}',${i},this.checked)"><label>${esc(x.text)}</label></div>`).join('')}</div>`).join('')}</div><div class="card"><b>Добавить свой пункт</b><div class="actions"><input id="newCheck" placeholder="Например: снять общий план зала"><button class="primary" onclick="addCheck()">＋</button></div></div>`;
}
function toggleCheck(k,i,v){current().checks[k][i].done=v;save()}
function resetChecklist(k){current().checks[k].forEach(x=>x.done=false);save();showTasks()}
function addCheck(){const v=newCheck.value.trim();if(!v)return;current().checks.shooting.push({text:v,done:false});save();showTasks()}
function showSettings(){
 const hasLegacy=LEGACY_KEYS.some(k=>!!localStorage.getItem(k));
 app.innerHTML=`<h2>Настройки</h2><div class="card"><b>Общие настройки техники по умолчанию</b><label>Камера</label><input value="${esc(db.settings.camera)}" onchange="db.settings.camera=this.value;save()"><label>Объективы</label><textarea onchange="db.settings.lenses=this.value;save()">${esc(db.settings.lenses)}</textarea><label>Стабилизатор</label><input value="${esc(db.settings.gimbal)}" onchange="db.settings.gimbal=this.value;save()"><label>Звук</label><input value="${esc(db.settings.audio)}" onchange="db.settings.audio=this.value;save()"></div>
 <div class="card"><b>🔄 База данных</b><p class="muted">База предыдущей версии переносится автоматически, если она найдена.</p>${hasLegacy?'<div class="notice">Найдена база предыдущей версии.</div>':''}<button class="primary" style="width:100%;margin-top:8px" onclick="migrateFromLegacyNow()">🔄 Подтянуть базу предыдущей версии</button><button class="secondary" style="width:100%;margin-top:8px" onclick="exportDatabase()">⬇️ Экспортировать базу</button><label style="display:block;margin-top:10px">Импорт базы</label><input id="importFile" type="file" accept=".json,application/json" onchange="importDatabase(this.files[0])"></div>
 <div class="card"><b>Свадьбы</b><p class="muted">Можно создавать сколько угодно отдельных свадеб. Все данные каждой свадьбы хранятся отдельно.</p><button class="secondary" onclick="showWeddings()">Открыть список свадеб</button></div><div class="card"><button class="secondary danger" style="width:100%" onclick="resetAll()">Сбросить все данные приложения</button></div>`;
}
function migrateFromLegacyNow(){
 let found=null,src='';for(const k of LEGACY_KEYS){const raw=localStorage.getItem(k);if(raw){try{const d=JSON.parse(raw);if(d&&Array.isArray(d.weddings)){found=d;src=k;break;}}catch(e){}}}
 if(!found)return alert('База предыдущей версии не найдена.');db=found;db.weddings.forEach(w=>{normalizeWedding(w);ensureOperational(w);syncRouteToEvents(w)});save();alert('База перенесена из '+src+'.');showWeddings();
}
function exportDatabase(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wedding-database-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importDatabase(file){
 if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.weddings))throw 0;db=d;db.weddings.forEach(w=>{normalizeWedding(w);ensureOperational(w);syncRouteToEvents(w)});save();alert('База импортирована.');showWeddings();}catch(e){alert('Не удалось импортировать базу. Проверь файл резервной копии.')}};r.readAsText(file);
}
function resetAll(){if(confirm('Удалить все свадьбы и настройки?')){localStorage.removeItem(KEY);location.reload()}}
showWeddings();
</script>
</body>
</html>
